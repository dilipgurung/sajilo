name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      # On main the release job builds the bundle itself (version-stamped),
      # so only PRs need this check.
      - name: Build universal app bundle
        if: github.event_name == 'pull_request'
        run: ./scripts/bundle.sh

  # Every merge to main publishes a GitHub release with the .pkg attached.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: write
    # Queue releases instead of racing: two quick merges must not compute
    # the same next version.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to pick the next version

      - name: Pick version
        id: version
        run: |
          # No release for an already-released commit (job re-run) or when
          # only README/AGENTS/CLAUDE.md changed since the last release.
          decision=$(./scripts/should_release.sh)
          if [[ "$decision" != "yes" ]]; then
            echo "Skipping release (${decision#no: })."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(./scripts/next_version.sh)
          echo "Releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        if: steps.version.outputs.skip != 'true'
        env:
          SAJILO_VERSION: ${{ steps.version.outputs.version }}
          SAJILO_BUILD: ${{ github.run_number }}
        run: |
          ./scripts/make_pkg.sh
          version="${SAJILO_VERSION}"
          stamped=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" dist/Sajilo.app/Contents/Info.plist)
          [[ "$stamped" == "$version" ]] || { echo "bundle version $stamped != $version" >&2; exit 1; }
          cd dist
          mv Sajilo.pkg "Sajilo-$version.pkg"
          # Same file under a fixed name, so releases/latest/download/Sajilo.pkg
          # (the website's download button) always gets the newest version.
          cp "Sajilo-$version.pkg" Sajilo.pkg
          ditto -c -k --keepParent Sajilo.app "Sajilo-$version.app.zip"
          shasum -a 256 "Sajilo-$version.pkg" Sajilo.pkg "Sajilo-$version.app.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "Sajilo $version" \
            --generate-notes \
            --notes "Download \`Sajilo-$version.pkg\`, then **right-click → Open** it (the installer is unsigned, so a plain double-click is blocked). See the [README](https://github.com/${{ github.repository }}#install) for setup." \
            "dist/Sajilo-$version.pkg" \
            dist/Sajilo.pkg \
            "dist/Sajilo-$version.app.zip" \
            dist/SHA256SUMS.txt
